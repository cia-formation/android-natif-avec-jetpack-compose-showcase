# Valeurs de configuration par défaut du showcase, commitées et volontairement vides.
#
# Pour activer la démo Supabase (leçon 6.5), copiez ces deux lignes dans local.properties
# (ignoré par git) et renseignez vos propres identifiants de projet :
#
#   SUPABASE_URL=https://votre-projet.supabase.co
#   SUPABASE_ANON_KEY=votre-cle-anon
#
# Pour la démo Firebase (leçon 6.4), déposez votre google-services.json dans app/.
# Sans ces valeurs, les deux leçons affichent un écran « non configuré » avec la
# checklist de mise en route, et le reste du showcase fonctionne normalement.
SUPABASE_URL=
SUPABASE_ANON_KEY=
